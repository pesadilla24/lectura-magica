<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura Mágica ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FEF9F0;
      --shadow: 0 8px 32px rgba(0,0,0,0.15);
      --radius: 28px;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family: 'Nunito', 'Comic Sans MS', cursive, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }
    body::before {
      content:''; position:fixed; top:-120px; right:-120px;
      width:420px; height:420px; border-radius:50%;
      background:radial-gradient(circle, rgba(255,107,107,.18), transparent);
      pointer-events:none; z-index:0;
    }
    body::after {
      content:''; position:fixed; bottom:-120px; left:-120px;
      width:420px; height:420px; border-radius:50%;
      background:radial-gradient(circle, rgba(76,201,240,.18), transparent);
      pointer-events:none; z-index:0;
    }

    /* ── SCREENS ── */
    .screen { display:none; min-height:100vh; width:100%; padding:20px 16px 50px; position:relative; z-index:1; }
    .screen.active { display:flex; flex-direction:column; align-items:center; }
    .screen.pop { animation: screenPop .45s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes screenPop {
      from { opacity:0; transform:scale(.93) translateY(18px); }
      to   { opacity:1; transform:scale(1)   translateY(0);    }
    }

    /* ── WELCOME ── */
    #welcome-screen {
      justify-content:center; align-items:center; text-align:center; gap:0;
      background:linear-gradient(155deg,#FFF9F0 0%,#FFF0F8 50%,#F0F8FF 100%);
    }
    .clouds { position:absolute; top:0; left:0; right:0; height:180px; overflow:hidden; pointer-events:none; }
    .cloud { position:absolute; font-size:3rem; opacity:.35; animation:drift 22s linear infinite; }
    .cloud:nth-child(1){top:10px;  animation-duration:20s;}
    .cloud:nth-child(2){top:55px;  animation-delay:-7s;  animation-duration:27s;}
    .cloud:nth-child(3){top:105px; animation-delay:-14s; animation-duration:18s; font-size:2.3rem;}
    @keyframes drift { from{transform:translateX(-200px);} to{transform:translateX(calc(100vw + 200px));} }

    .mascot-wrap { position:relative; margin-bottom:6px; }
    .mascot { font-size:clamp(4.5rem,14vw,8rem); display:block; animation:mascotBounce 2.2s ease-in-out infinite; filter:drop-shadow(0 10px 20px rgba(0,0,0,.1)); }
    .mascot-sparkle { position:absolute; top:-8px; right:-8px; font-size:2rem; animation:sparkle 3s ease-in-out infinite; }
    @keyframes mascotBounce { 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-20px) rotate(4deg);} }
    @keyframes sparkle      { 0%,100%{transform:rotate(0deg) scale(1);} 50%{transform:rotate(22deg) scale(1.35);} }

    .app-title {
      font-family:'Fredoka One',cursive;
      font-size:clamp(3.5rem,12vw,7rem);
      line-height:1.05;
      background:linear-gradient(130deg,#FF6B35 0%,#FF6B9D 38%,#A855F7 65%,#4CC9F0 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter:drop-shadow(2px 2px 0 rgba(0,0,0,.05));
    }
    .app-tagline { font-size:clamp(.95rem,3.2vw,1.45rem); color:#999; font-weight:800; margin-bottom:28px; letter-spacing:.5px; }

    .float-row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:32px; }
    .fe { font-size:clamp(1.8rem,6vw,3.2rem); animation:floatY 4s ease-in-out infinite; display:inline-block; }
    .fe:nth-child(1){animation-delay:0s;}   .fe:nth-child(2){animation-delay:.65s;}
    .fe:nth-child(3){animation-delay:1.3s;} .fe:nth-child(4){animation-delay:1.95s;}
    .fe:nth-child(5){animation-delay:2.6s;}
    @keyframes floatY { 0%,100%{transform:translateY(0) rotate(-5deg);} 50%{transform:translateY(-16px) rotate(5deg);} }

    .btn-start {
      font-family:'Fredoka One',cursive; font-size:clamp(1.4rem,5vw,2.2rem);
      padding:20px 58px; color:white; border:none; border-radius:50px; cursor:pointer;
      background:linear-gradient(135deg,#FF6B35,#FF9A56);
      box-shadow:0 8px 0 #C94D1E, 0 14px 28px rgba(255,107,53,.38);
      position:relative; top:0; transition:all .15s;
    }
    .btn-start:active  { top:6px; box-shadow:0 2px 0 #C94D1E; }
    .btn-start:hover   { background:linear-gradient(135deg,#FF5722,#FF8A44); transform:scale(1.03); }

    /* ── LEVELS ── */
    #levels-screen { gap:20px; padding-top:28px; }
    .screen-h { font-family:'Fredoka One',cursive; font-size:clamp(1.9rem,7vw,3.2rem); color:#333; text-align:center; }

    .stars-banner {
      background:linear-gradient(135deg,#FFF8E1,#FFF3CD); border:3px solid #FFD93D;
      border-radius:22px; padding:14px 28px; display:flex; align-items:center; gap:14px;
      width:100%; max-width:700px; box-shadow:0 5px 0 #E6C200;
    }
    .sb-star  { font-size:2.4rem; animation:starPulse 2s ease-in-out infinite; }
    .sb-text  { flex:1; }
    .sb-count { font-family:'Fredoka One',cursive; font-size:1.7rem; color:#C94D1E; }
    .sb-sub   { font-size:.85rem; color:#999; font-weight:700; }
    @keyframes starPulse { 0%,100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.2) rotate(15deg);} }

    .levels-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:18px; width:100%; max-width:850px; }
    .lcard {
      background:white; border-radius:24px; padding:26px 14px; text-align:center; cursor:pointer;
      transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
      box-shadow:0 6px 0 rgba(0,0,0,.1), 0 10px 24px rgba(0,0,0,.09);
      position:relative; overflow:hidden; border:3px solid transparent;
    }
    .lcard-bar  { position:absolute; top:0; left:0; right:0; height:6px; }
    .lcard:not(.locked):hover  { transform:translateY(-9px) scale(1.03); box-shadow:0 16px 0 rgba(0,0,0,.07), 0 22px 40px rgba(0,0,0,.11); }
    .lcard:not(.locked):active { transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,.1); }
    .lcard.locked   { opacity:.55; cursor:not-allowed; }
    .lcard.done     { border-color:var(--lc); }
    .lcard-emoji    { font-size:clamp(2.8rem,8vw,4.2rem); margin-bottom:6px; display:block; filter:drop-shadow(0 4px 8px rgba(0,0,0,.1)); }
    .lcard-num      { font-size:.78rem; color:#BBB; text-transform:uppercase; letter-spacing:2px; font-weight:800; margin-bottom:4px; }
    .lcard-name     { font-family:'Fredoka One',cursive; font-size:clamp(.95rem,3vw,1.25rem); color:#333; margin-bottom:10px; }
    .lcard-stars    { display:flex; justify-content:center; gap:4px; font-size:1.35rem; }
    .lock-overlay   { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.72); backdrop-filter:blur(2px); border-radius:22px; font-size:2.4rem; }

    .btn-back {
      background:white; border:3px solid #E0E0E0; color:#777; border-radius:20px;
      padding:12px 30px; font-family:'Fredoka One',cursive; font-size:1.15rem;
      cursor:pointer; transition:all .2s; box-shadow:0 4px 0 #D0D0D0;
    }
    .btn-back:hover  { background:#F5F5F5; transform:translateY(-2px); }
    .btn-back:active { transform:translateY(2px); box-shadow:0 1px 0 #D0D0D0; }

    /* ── READING ── */
    #reading-screen { gap:16px; max-width:750px; margin:0 auto; }
    .topbar { display:flex; align-items:center; justify-content:space-between; width:100%; max-width:700px; }
    .icon-btn {
      background:white; border:none; border-radius:50%; width:50px; height:50px;
      font-size:1.55rem; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.1);
      display:flex; align-items:center; justify-content:center; transition:all .2s;
    }
    .icon-btn:hover  { transform:scale(1.1); }
    .icon-btn:active { transform:scale(.93); }
    .level-pill { font-family:'Fredoka One',cursive; font-size:.98rem; padding:8px 20px; border-radius:50px; color:white; }

    .prog-track { width:100%; max-width:700px; height:13px; background:#EAEAEA; border-radius:10px; overflow:hidden; }
    .prog-fill  { height:100%; border-radius:10px; background:linear-gradient(90deg,#06D6A0,#4CC9F0); transition:width .6s cubic-bezier(.34,1.56,.64,1); }

    .storybook { background:white; border-radius:var(--radius); width:100%; max-width:700px; overflow:hidden; box-shadow:var(--shadow); }
    .book-header { padding:28px 28px 18px; text-align:center; }
    .book-illo {
      font-size:clamp(5rem,18vw,9rem); display:block; margin-bottom:10px;
      filter:drop-shadow(0 8px 16px rgba(0,0,0,.08)); animation:illoFloat 5s ease-in-out infinite;
    }
    @keyframes illoFloat { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-12px) scale(1.02);} }
    .book-title { font-family:'Fredoka One',cursive; font-size:clamp(1.45rem,5vw,2.4rem); }
    .book-body  { padding:18px 26px 26px; background:#F8FAFE; border-top:3px dashed #E5EDF8; }
    .story-para { font-size:clamp(1.15rem,3.8vw,1.65rem); line-height:2.3; color:#333; font-weight:700; margin-bottom:6px; }
    .sw { display:inline-block; border-radius:7px; padding:1px 3px; transition:all .15s; cursor:default; }
    .sw.lit { background:#FFD93D; transform:scale(1.08); color:#000; }

    .read-actions { display:flex; gap:12px; width:100%; max-width:700px; flex-wrap:wrap; }
    .btn-speak {
      flex:1; min-width:130px; font-family:'Fredoka One',cursive; font-size:clamp(.95rem,3vw,1.35rem);
      padding:16px 22px; background:linear-gradient(135deg,#7B2FBE,#A855F7); color:white;
      border:none; border-radius:50px; cursor:pointer; box-shadow:0 6px 0 #5B1A9E;
      position:relative; top:0; transition:all .15s;
    }
    .btn-speak:active { top:4px; box-shadow:0 2px 0 #5B1A9E; }
    .btn-quiz {
      flex:1; min-width:130px; font-family:'Fredoka One',cursive; font-size:clamp(.95rem,3vw,1.35rem);
      padding:16px 22px; background:linear-gradient(135deg,#06D6A0,#38E8B5); color:white;
      border:none; border-radius:50px; cursor:pointer; box-shadow:0 6px 0 #04A67B;
      position:relative; top:0; transition:all .15s;
    }
    .btn-quiz:active  { top:4px; box-shadow:0 2px 0 #04A67B; }
    .btn-speak:hover, .btn-quiz:hover { filter:brightness(1.06); transform:scale(1.02); }

    /* ── QUIZ ── */
    #quiz-screen { gap:16px; max-width:750px; margin:0 auto; }
    .qcard { background:white; border-radius:var(--radius); padding:32px 28px; width:100%; max-width:700px; box-shadow:var(--shadow); }
    .q-num  { background:#F0F4FF; color:#888; font-size:.82rem; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; padding:6px 14px; border-radius:20px; display:inline-block; margin-bottom:18px; }
    .q-text { font-family:'Fredoka One',cursive; font-size:clamp(1.25rem,4.5vw,1.95rem); color:#222; line-height:1.4; margin-bottom:22px; }
    .ans-grid { display:flex; flex-direction:column; gap:11px; }
    .ans-btn {
      font-family:'Nunito',cursive; font-weight:800; font-size:clamp(.98rem,3.2vw,1.3rem);
      padding:17px 22px; border:3px solid #E8EAF0; border-radius:18px; cursor:pointer;
      background:#FAFBFF; color:#333; width:100%; text-align:left;
      display:flex; align-items:center; gap:12px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      transition:all .2s;
    }
    .ans-letter {
      width:36px; height:36px; border-radius:50%; background:#EAEAEA;
      display:flex; align-items:center; justify-content:center;
      font-family:'Fredoka One',cursive; font-size:.95rem; color:#777;
      flex-shrink:0; transition:all .2s;
    }
    .ans-btn:hover:not(:disabled) { border-color:#4CC9F0; background:#F0FAFF; transform:translateX(6px); }
    .ans-btn:hover:not(:disabled) .ans-letter { background:#4CC9F0; color:white; }
    .ans-btn.ok  { border-color:#06D6A0; background:#E8FFF6; color:#015A41; }
    .ans-btn.ok  .ans-letter { background:#06D6A0; color:white; }
    .ans-btn.bad { border-color:#FF4444; background:#FFF0F0; color:#8B0000; }
    .ans-btn.bad .ans-letter { background:#FF4444; color:white; }
    @keyframes shakeX { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} }
    .shakeX { animation:shakeX .4s ease; }

    /* ── RESULTS ── */
    #results-screen { justify-content:center; gap:20px; text-align:center; padding-top:40px; }
    .rcard { background:white; border-radius:var(--radius); padding:48px 32px; width:100%; max-width:580px; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:16px; }
    .r-emoji  { font-size:clamp(5rem,18vw,8rem); animation:rPop .6s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes rPop { 0%{transform:scale(0) rotate(-20deg);} 100%{transform:scale(1) rotate(0);} }
    .r-title  { font-family:'Fredoka One',cursive; font-size:clamp(1.9rem,7vw,2.9rem); }
    .r-stars  { display:flex; gap:8px; }
    .r-star   { font-size:clamp(2.5rem,8vw,3.8rem); animation:starPop .4s cubic-bezier(.34,1.56,.64,1) both; display:inline-block; }
    .r-star:nth-child(1){animation-delay:.3s;} .r-star:nth-child(2){animation-delay:.5s;} .r-star:nth-child(3){animation-delay:.7s;}
    @keyframes starPop { 0%{transform:scale(0) rotate(-30deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;} }
    .r-detail { font-size:1.15rem; color:#999; font-weight:700; background:#F5F5F5; padding:9px 24px; border-radius:50px; }
    .r-actions { display:flex; flex-direction:column; gap:12px; width:100%; max-width:350px; margin-top:6px; }
    .btn-n {
      font-family:'Fredoka One',cursive; font-size:1.35rem; padding:18px 38px;
      border:none; border-radius:50px; cursor:pointer;
      position:relative; top:0; transition:all .15s;
    }
    .btn-n:active { top:4px; }
    .btn-n:hover  { filter:brightness(1.06); transform:scale(1.02); }
    .btn-n.pri  { background:linear-gradient(135deg,#FF6B35,#FF9A56); color:white; box-shadow:0 6px 0 #C94D1E; }
    .btn-n.sec  { background:white; color:#777; border:3px solid #E0E0E0; box-shadow:0 4px 0 #D0D0D0; }

    /* ── CONFETTI ── */
    #confetti { position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
    .cp { position:absolute; top:-30px; animation:cpFall linear forwards; border-radius:3px; }
    @keyframes cpFall {
      0%   { transform:translateY(0)     rotate(0deg)   scale(1);   opacity:1; }
      80%  {                                                          opacity:1; }
      100% { transform:translateY(110vh) rotate(720deg) scale(.5);  opacity:0; }
    }

    /* ── POP LABEL ── */
    .pop-lbl { position:fixed; top:50%; left:50%; font-size:4rem; transform:translate(-50%,-50%) scale(0); animation:popLbl 1.2s ease forwards; pointer-events:none; z-index:500; }
    @keyframes popLbl {
      0%   { transform:translate(-50%,-50%) scale(0);   opacity:1; }
      40%  { transform:translate(-50%,-80%) scale(1.5); opacity:1; }
      100% { transform:translate(-50%,-130%) scale(1);  opacity:0; }
    }

    /* ── RESPONSIVE ── */
    @media(max-width:480px){
      .levels-grid { grid-template-columns:repeat(2,1fr); gap:13px; }
      .book-header  { padding:20px 18px 14px; }
      .book-body    { padding:14px 16px 20px; }
      .qcard        { padding:24px 18px; }
      .rcard        { padding:36px 20px; }
      .read-actions { flex-direction:column; }
    }
  </style>
</head>
<body>

<div id="confetti"></div>

<!-- ══════════ WELCOME ══════════ -->
<div class="screen active" id="welcome-screen">
  <div class="clouds">
    <div class="cloud" style="left:-100px">☁️</div>
    <div class="cloud" style="left:-180px">☁️</div>
    <div class="cloud" style="left:-240px">☁️</div>
  </div>
  <div class="mascot-wrap">
    <span class="mascot">🦊</span>
    <span class="mascot-sparkle">✨</span>
  </div>
  <div class="app-title">Lectura<br>Mágica</div>
  <p class="app-tagline">¡Aprende a leer con Foxy! 📖</p>
  <div class="float-row">
    <span class="fe">📚</span><span class="fe">⭐</span>
    <span class="fe">🎉</span><span class="fe">🌈</span><span class="fe">🦋</span>
  </div>
  <button class="btn-start" onclick="go('levels')">¡Jugar! 🎮</button>
</div>

<!-- ══════════ LEVELS ══════════ -->
<div class="screen" id="levels-screen">
  <h1 class="screen-h">🗺️ ¡Elige tu nivel!</h1>
  <div class="stars-banner">
    <span class="sb-star">⭐</span>
    <div class="sb-text">
      <div class="sb-count" id="total-stars">0 / 15 estrellas</div>
      <div class="sb-sub">¡Colecciona todas las estrellas!</div>
    </div>
    <span class="sb-star" style="animation-delay:1s">🏆</span>
  </div>
  <div class="levels-grid" id="levels-grid"></div>
  <button class="btn-back" onclick="go('welcome')">🏠 Inicio</button>
</div>

<!-- ══════════ READING ══════════ -->
<div class="screen" id="reading-screen">
  <div class="topbar">
    <button class="icon-btn" onclick="go('levels')">⬅️</button>
    <div class="level-pill" id="r-pill">Nivel 1</div>
    <button class="icon-btn" onclick="speakStory()" id="hint-btn">💡</button>
  </div>
  <div class="prog-track"><div class="prog-fill" id="r-prog" style="width:12%"></div></div>
  <div class="storybook">
    <div class="book-header">
      <span class="book-illo" id="b-illo">🐶</span>
      <div class="book-title" id="b-title">Título</div>
    </div>
    <div class="book-body" id="b-body"></div>
  </div>
  <div class="read-actions">
    <button class="btn-speak" id="btn-speak" onclick="speakStory()">🔊 Escuchar</button>
    <button class="btn-quiz" onclick="startQuiz()">🤔 Responder ➡️</button>
  </div>
</div>

<!-- ══════════ QUIZ ══════════ -->
<div class="screen" id="quiz-screen">
  <div class="topbar">
    <button class="icon-btn" id="q-back">⬅️</button>
    <div class="level-pill" id="q-pill">Preguntas</div>
    <div style="width:50px"></div>
  </div>
  <div class="prog-track"><div class="prog-fill" id="q-prog" style="width:0%"></div></div>
  <div class="qcard">
    <div class="q-num" id="q-num">Pregunta 1 de 3</div>
    <div class="q-text" id="q-text">¿Cuál es la pregunta?</div>
    <div class="ans-grid" id="ans-grid"></div>
  </div>
</div>

<!-- ══════════ RESULTS ══════════ -->
<div class="screen" id="results-screen">
  <div class="rcard">
    <div class="r-emoji" id="r-emoji">🎉</div>
    <div class="r-title" id="r-title">¡Genial!</div>
    <div class="r-stars" id="r-stars"></div>
    <div class="r-detail" id="r-detail">3 de 3 correctas</div>
    <div class="r-actions">
      <button class="btn-n pri" id="btn-next">¡Siguiente nivel! ➡️</button>
      <button class="btn-n sec" onclick="go('levels')">🗺️ Ver niveles</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════
   NIVEL DATA
═══════════════════════════ */
const LEVELS = [
  {
    id:1, title:"Los Animales", emoji:"🐶",
    color:"#FF6B6B", shadow:"#CC3333", bg:"#FFF5F5",
    story:{
      illo:"🐶🐱🐰", ttl:"¡Hola, Tomi!",
      lines:[
        "El perro se llama Tomi.",
        "Tomi es café y muy grande.",
        "A Tomi le gusta jugar.",
        "Tomi corre con la pelota.",
        "¡Tomi es muy divertido!"
      ]
    },
    qs:[
      {q:"¿Cómo se llama el perro?",     ic:"🐶", opts:["Tobi","Tomi","Tito"],        ok:1},
      {q:"¿De qué color es Tomi?",       ic:"🎨", opts:["Negro","Blanco","Café"],      ok:2},
      {q:"¿Qué le gusta hacer a Tomi?",  ic:"⚽", opts:["Dormir","Jugar","Nadar"],     ok:1}
    ]
  },
  {
    id:2, title:"El Mar", emoji:"🐠",
    color:"#4ECDC4", shadow:"#2A9D8F", bg:"#F0FFFE",
    story:{
      illo:"🐠🦈🌊", ttl:"Nemo y el Mar",
      lines:[
        "Nemo es un pez naranja.",
        "Nemo vive en el mar azul.",
        "El mar tiene muchos peces.",
        "También hay algas verdes.",
        "Nemo nada muy rápido.",
        "¡El mar es su hogar!"
      ]
    },
    qs:[
      {q:"¿De qué color es Nemo?",  ic:"🎨", opts:["Azul","Naranja","Rojo"],              ok:1},
      {q:"¿Dónde vive Nemo?",       ic:"🌊", opts:["En el río","En el lago","En el mar"],  ok:2},

/* ═══════════════════════════
   STATE
═══════════════════════════ */
const G = { lvIdx:0, qIdx:0, correct:0, unlocked:1, stars:[0,0,0,0,0], speaking:false };

function loadG(){
  try{ const s=localStorage.getItem('lm3'); if(s){ const d=JSON.parse(s); G.unlocked=d.unlocked||1; G.stars=d.stars||[0,0,0,0,0]; } }catch(e){}
}
function saveG(){
  try{ localStorage.setItem('lm3', JSON.stringify({unlocked:G.unlocked, stars:G.stars})); }catch(e){}
}

/* ═══════════════════════════
   NAVIGATION
═══════════════════════════ */
function go(name){
  stopSpeak();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active','pop'));
  const ids={welcome:'welcome-screen',levels:'levels-screen',reading:'reading-screen',quiz:'quiz-screen',results:'results-screen'};
  const el=document.getElementById(ids[name]||name);
  el.classList.add('active');
  requestAnimationFrame(()=>{ el.classList.add('pop'); });
  if(name==='levels'){ buildLevels(); updateBanner(); }
}

/* ═══════════════════════════
   LEVEL GRID
═══════════════════════════ */
function buildLevels(){
  const g=document.getElementById('levels-grid');
  g.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const ok=i<G.unlocked, earned=G.stars[i];
    const card=document.createElement('div');
    if(i<G.unlocked) card.className='lcard'+(earned>0?' done':'');
    else             card.className='lcard locked';
    card.style.setProperty('--lc',lv.color);
    if(ok) card.onclick=()=>openLevel(i);
    let stars='';
    for(let s=0;s<3;s++) stars+=`<span style="color:${s<earned?'#FFD93D':'#DDD'}">★</span>`;
    card.innerHTML=`
      <div class="lcard-bar" style="background:${lv.color}"></div>
      <span class="lcard-emoji">${lv.emoji}</span>
      <div class="lcard-num">Nivel ${lv.id}</div>
      <div class="lcard-name">${lv.title}</div>
      <div class="lcard-stars">${stars}</div>
      ${!ok?'<div class="lock-overlay">🔒</div>':''}
    `;
    g.appendChild(card);
  });
}
function updateBanner(){
  const t=G.stars.reduce((a,b)=>a+b,0);
  document.getElementById('total-stars').textContent=t+' / 15 estrellas';
}

/* ═══════════════════════════
   OPEN LEVEL
═══════════════════════════ */
function openLevel(i){
  G.lvIdx=i; G.qIdx=0; G.correct=0;
  const lv=LEVELS[i];
  document.getElementById('r-pill').textContent=`Nivel ${lv.id}: ${lv.title}`;
  document.getElementById('r-pill').style.background=lv.color;
  document.getElementById('r-prog').style.width='12%';
  document.getElementById('r-prog').style.background=`linear-gradient(90deg,${lv.color},${lv.shadow})`;
  document.getElementById('b-illo').textContent=lv.story.illo;
  document.getElementById('b-title').textContent=lv.story.ttl;
  document.getElementById('b-title').style.color=lv.color;

  // Reset illo animation
  const illo=document.getElementById('b-illo');
  illo.style.animation='none'; void illo.offsetWidth; illo.style.animation='';

  // Build story text
  const body=document.getElementById('b-body');
  body.style.background=lv.bg;
  body.innerHTML=lv.story.lines.map((line,li)=>
    `<p class="story-para">${line.split(' ').map((w,wi)=>`<span class="sw" data-li="${li}" data-wi="${wi}">${w}</span>`).join(' ')}</p>`
  ).join('');

  document.getElementById('btn-speak').textContent='🔊 Escuchar';
  document.getElementById('q-back').onclick=()=>openLevel(i);
  go('reading');
}

/* ═══════════════════════════
   SPEECH
═══════════════════════════ */
let speakTimer=null;

function stopSpeak(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(speakTimer){ clearTimeout(speakTimer); speakTimer=null; }
  G.speaking=false;
  const b=document.getElementById('btn-speak');
  if(b) b.textContent='🔊 Escuchar';
  document.querySelectorAll('.sw.lit').forEach(e=>e.classList.remove('lit'));
}

function speakStory(){
  if(G.speaking){ stopSpeak(); return; }
  G.speaking=true;
  document.getElementById('btn-speak').textContent='✋ Detener';
  const lv=LEVELS[G.lvIdx];
  const allWords=[...document.querySelectorAll('.sw')];
  let idx=0;

  if(window.speechSynthesis){
    const utt=new SpeechSynthesisUtterance(lv.story.lines.join('. '));
    utt.lang='es-ES'; utt.rate=0.72; utt.pitch=1.15;
    const voices=window.speechSynthesis.getVoices();
    const v=voices.find(v=>v.lang.startsWith('es')&&v.name.toLowerCase().includes('female'))
           ||voices.find(v=>v.lang.startsWith('es'));
    if(v) utt.voice=v;
    utt.onend=stopSpeak; utt.onerror=stopSpeak;
    window.speechSynthesis.speak(utt);
  }

  // Word highlight loop
  function step(){
    if(!G.speaking) return;
    allWords.forEach(e=>e.classList.remove('lit'));
    if(idx<allWords.length){
      allWords[idx].classList.add('lit');
      allWords[idx].scrollIntoView({behavior:'smooth',block:'nearest'});
      idx++;
      speakTimer=setTimeout(step, 330);
    } else { stopSpeak(); }
  }
  step();
}

if(window.speechSynthesis){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
}

/* ═══════════════════════════
   QUIZ
═══════════════════════════ */
function startQuiz(){
  stopSpeak();
  G.qIdx=0; G.correct=0;
  const lv=LEVELS[G.lvIdx];
  document.getElementById('q-pill').textContent=`📖 ${lv.title}`;
  document.getElementById('q-pill').style.background=lv.color;
  document.getElementById('q-prog').style.background=`linear-gradient(90deg,${lv.color},${lv.shadow})`;
  go('quiz');
  renderQ();
}

function renderQ(){
  const lv=LEVELS[G.lvIdx], q=lv.qs[G.qIdx], total=lv.qs.length;
  document.getElementById('q-prog').style.width=`${(G.qIdx/total)*100}%`;
  document.getElementById('q-num').textContent=`Pregunta ${G.qIdx+1} de ${total}`;
  document.getElementById('q-text').textContent=`${q.ic} ${q.q}`;

  const grid=document.getElementById('ans-grid');
  grid.innerHTML='';
  ['A','B','C'].forEach((letter,i)=>{
    const btn=document.createElement('button');
    btn.className='ans-btn';
    btn.innerHTML=`<span class="ans-letter">${letter}</span><span>${q.opts[i]}</span>`;
    btn.onclick=()=>checkAns(i,btn,q);
    grid.appendChild(btn);
  });
}

function checkAns(chosen, btn, q){
  document.querySelectorAll('.ans-btn').forEach(b=>{ b.onclick=null; b.style.opacity='.72'; b.style.cursor='default'; });
  const allBtns=document.querySelectorAll('.ans-btn');
  allBtns[q.ok].style.opacity='1';
  if(chosen===q.ok){
    G.correct++;
    btn.classList.add('ok'); btn.style.opacity='1';
    popup('✅');
  } else {
    btn.classList.add('bad','shakeX'); btn.style.opacity='1';
    allBtns[q.ok].classList.add('ok');
    popup('❌');
  }
  setTimeout(()=>{
    G.qIdx++;
    if(G.qIdx<LEVELS[G.lvIdx].qs.length) renderQ();
    else showResults();
  }, 1600);
}

function popup(emoji){
  const el=document.createElement('div');
  el.className='pop-lbl'; el.textContent=emoji;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1300);
}

/* ═══════════════════════════
   RESULTS
═══════════════════════════ */
function showResults(){
  const lv=LEVELS[G.lvIdx], total=lv.qs.length, got=G.correct;
  let stars=0;
  if(got===total) stars=3; else if(got>=total-1) stars=2; else if(got>=1) stars=1;

  if(stars>G.stars[G.lvIdx]) G.stars[G.lvIdx]=stars;
  if(stars>=1 && G.lvIdx+1<LEVELS.length) G.unlocked=Math.max(G.unlocked, G.lvIdx+2);
  saveG();

  const cfgs={
    3:{e:'🏆',t:'¡Perfecto!',       c:'#FFD93D'},
    2:{e:'🌟',t:'¡Muy bien!',       c:'#06D6A0'},
    1:{e:'😊',t:'¡Buen intento!',   c:'#4CC9F0'},
    0:{e:'💪',t:'¡Inténtalo otra vez!',c:'#FF6B6B'}
  };
  const cfg=cfgs[stars];
  document.getElementById('r-emoji').textContent=cfg.e;
  document.getElementById('r-title').textContent=cfg.t;
  document.getElementById('r-title').style.color=cfg.c;
  document.getElementById('r-detail').textContent=`${got} de ${total} respuestas correctas`;

  const starsEl=document.getElementById('r-stars');
  starsEl.innerHTML=[0,1,2].map(i=>
    `<span class="r-star" style="filter:${i<stars?'drop-shadow(0 0 8px #FFD93D)':'grayscale(1) opacity(.35)'}">⭐</span>`
  ).join('');

  const nb=document.getElementById('btn-next');
  if(G.lvIdx<LEVELS.length-1 && G.unlocked>G.lvIdx+1){
    nb.textContent='¡Siguiente nivel! ➡️';
    nb.onclick=()=>openLevel(G.lvIdx+1);
    nb.style.display='block';
  } else if(G.lvIdx>=LEVELS.length-1){
    nb.textContent='🎊 ¡Todo completado!';
    nb.onclick=()=>go('levels');
  } else {
    nb.textContent='🔄 Intentar de nuevo';
    nb.onclick=()=>openLevel(G.lvIdx);
  }

  go('results');
  if(stars>0) setTimeout(()=>confetti(stars),400);
}

/* ═══════════════════════════
   CONFETTI
═══════════════════════════ */
function confetti(stars){
  const layer=document.getElementById('confetti');
  const cols=['#FF6B6B','#4ECDC4','#FFD93D','#06D6A0','#CC5DE8','#FF6B35','#4CC9F0','#FF6B9D'];
  const shapes=['●','▲','■','◆','★','♥'];
  const n=stars===3?130:stars===2?85:50;
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const p=document.createElement('span');
      p.className='cp';
      p.textContent=shapes[Math.random()*shapes.length|0];
      const sz=9+Math.random()*18, dur=2.5+Math.random()*2;
      p.style.cssText=`left:${Math.random()*100}%;font-size:${sz}px;color:${cols[Math.random()*cols.length|0]};animation:cpFall ${dur}s linear forwards;animation-delay:${Math.random()*.8}s;`;
      layer.appendChild(p);
      setTimeout(()=>p.remove(),(dur+1)*1000);
    },i*18);
  }
}

/* ═══════════════════════════
   INIT
═══════════════════════════ */
loadG();
</script>
